<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDVX Helper Whole Layout 1</title>
    <style>
        :root {
            --canvas-width: 1920px;
            --canvas-height: 1080px;
            --side-width: 656px;
            --game-width: 608px;
            --outer-gap: 8px;
            --panel-gap: 8px;
            --panel-border: rgba(112, 214, 255, 0.72);
            --panel-bg: rgba(4, 8, 24, 0.92);
            --page-bg: #030510;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            font-family: "Meiryo", sans-serif;
        }

        .stage {
            width: var(--canvas-width);
            height: var(--canvas-height);
            display: grid;
            grid-template-columns: var(--side-width) var(--game-width) var(--side-width);
            background:
                radial-gradient(circle at 0 0, rgba(0, 197, 255, 0.17), transparent 34%),
                radial-gradient(circle at 100% 100%, rgba(255, 42, 211, 0.15), transparent 34%),
                linear-gradient(135deg, #070b20 0%, var(--page-bg) 50%, #11051c 100%);
            transform-origin: top left;
            overflow: hidden;
        }

        .side-frame {
            min-width: 0;
            height: var(--canvas-height);
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: var(--panel-gap);
            padding: var(--outer-gap);
        }

        .right-frame {
            grid-template-rows: 4fr 3fr 3fr;
        }

        .left-frame {
            grid-template-rows: 150px minmax(0, 1fr);
        }

        .game-frame {
            width: var(--game-width);
            height: var(--canvas-height);
            position: relative;
            overflow: hidden;
            background: #000;
            box-shadow:
                inset 1px 0 rgba(255, 255, 255, 0.28),
                inset -1px 0 rgba(255, 255, 255, 0.28),
                0 0 32px rgba(95, 211, 255, 0.18);
        }

        .game-frame::before,
        .game-frame::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            pointer-events: none;
            z-index: 2;
        }

        .game-frame::before {
            left: 0;
            background: linear-gradient(#62e6ff, #2946ff 45%, #ef58ff);
        }

        .game-frame::after {
            right: 0;
            background: linear-gradient(#ef58ff, #2946ff 55%, #62e6ff);
        }

        .panel {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.10),
                inset 0 0 24px rgba(33, 128, 255, 0.08),
                0 0 14px rgba(42, 194, 255, 0.22);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.045), transparent 14%, transparent 86%, rgba(255, 255, 255, 0.035)),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 5px);
        }

        .panel::after {
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            top: 0;
            height: 2px;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, #79edff 20%, #c16cff 80%, transparent);
            opacity: 0.72;
        }

        .scaled-iframe {
            position: absolute;
            top: 0;
            left: 0;
            border: 0;
            transform-origin: top left;
            background: transparent;
        }

        #panel-comment {
            background:
                linear-gradient(135deg, rgba(11, 25, 54, 0.72), rgba(45, 8, 48, 0.72)),
                var(--panel-bg);
        }
    </style>
</head>

<body>
    <main class="stage" id="stage">
        <section class="side-frame left-frame">
            <div class="panel" id="panel-nowplaying">
                <iframe class="scaled-iframe" id="iframe-nowplaying" src="./nowplaying_v2.html" scrolling="no"></iframe>
            </div>
            <div class="panel" id="panel-today-result">
                <iframe class="scaled-iframe" id="iframe-today-result" src="./today_result.html"
                    scrolling="no"></iframe>
            </div>
        </section>

        <section class="game-frame" aria-label="game screen placeholder"></section>

        <section class="side-frame right-frame">
            <div class="panel" id="panel-history-cursong">
                <iframe class="scaled-iframe" id="iframe-history-cursong" src="./history_cursong.html"
                    scrolling="no"></iframe>
            </div>
            <div class="panel" id="panel-rival">
                <iframe class="scaled-iframe" id="iframe-rival" src="./rival.html" scrolling="no"></iframe>
            </div>
            <div class="panel" id="panel-comment"></div>
        </section>
    </main>

    <script>
        const iframeConfigs = [
            { iframe: "iframe-nowplaying", panel: "panel-nowplaying", width: 1200, height: 500, mode: "fixed-cover" },
            { iframe: "iframe-today-result", panel: "panel-today-result", width: 1200, mode: "responsive-width" },
            { iframe: "iframe-history-cursong", panel: "panel-history-cursong", width: 2176, height: 1424, mode: "fit" },
            { iframe: "iframe-rival", panel: "panel-rival", width: 2480, mode: "responsive-width" }
        ];

        function appendSearchToIframeSrc() {
            const pageParams = new URLSearchParams(location.search);
            document.querySelectorAll("iframe").forEach((iframe) => {
                const rawSrc = iframe.getAttribute("src");
                if (!rawSrc || rawSrc === "about:blank") return;
                const src = new URL(rawSrc, location.href);
                pageParams.forEach((value, key) => src.searchParams.set(key, value));
                src.searchParams.set("_cache", Date.now().toString());
                iframe.src = src.pathname.split("/").pop() + src.search;
            });
        }

        function scaleStageForPreview() {
            const stage = document.getElementById("stage");
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
            stage.style.transform = `scale(${scale})`;
        }

        function setupScaledIframe(config) {
            const iframe = document.getElementById(config.iframe);
            const panel = document.getElementById(config.panel);
            if (!iframe || !panel) return;

            function applyScale() {
                const width = panel.clientWidth;
                const height = panel.clientHeight;
                if (!width || !height) return;

                if (config.mode === "fixed-cover") {
                    const scale = Math.max(width / config.width, height / config.height);
                    const offsetX = (width - config.width * scale) / 2;
                    const offsetY = (height - config.height * scale) / 2;
                    iframe.style.width = `${config.width}px`;
                    iframe.style.height = `${config.height}px`;
                    iframe.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
                    return;
                }

                if (config.mode === "responsive-width") {
                    const scale = width / config.width;
                    iframe.style.width = `${config.width}px`;
                    iframe.style.height = `${height / scale}px`;
                    iframe.style.transform = `scale(${scale})`;
                    return;
                }

                const scale = Math.min(width / config.width, height / config.height);
                const offsetX = (width - config.width * scale) / 2;
                const offsetY = (height - config.height * scale) / 2;
                iframe.style.width = `${config.width}px`;
                iframe.style.height = `${config.height}px`;
                iframe.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            }

            iframe.addEventListener("load", applyScale);
            new ResizeObserver(applyScale).observe(panel);
            window.addEventListener("resize", applyScale);
            applyScale();
        }

        appendSearchToIframeSrc();
        iframeConfigs.forEach(setupScaledIframe);
        scaleStageForPreview();
        window.addEventListener("resize", scaleStageForPreview);
    </script>
</body>

</html>
