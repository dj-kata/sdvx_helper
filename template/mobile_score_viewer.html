<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SDVX Helper Scores</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #181b20;
      --panel2: #20242a;
      --text: #f4f7f8;
      --muted: #9ba8ad;
      --line: #30363d;
      --teal: #35d0b5;
      --coral: #ff6b6b;
      --amber: #ffd166;
      --blue: #7ab8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input {
      font: inherit;
    }
    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(16, 18, 21, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    }
    .top {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
    }
    .icon-btn:disabled {
      opacity: 0.35;
    }
    h1 {
      margin: 0;
      min-width: 0;
      font-size: 18px;
      line-height: 1.2;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #121519;
    }
    .stat {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    main {
      min-height: 0;
      overflow-y: auto;
      padding: 12px 12px max(24px, env(safe-area-inset-bottom));
    }
    .grid {
      display: grid;
      gap: 8px;
    }
    .folders {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .folder {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(135deg, var(--panel), #14181e);
      color: var(--text);
      padding: 12px;
      text-align: left;
    }
    .folder.primary { border-color: color-mix(in srgb, var(--teal), var(--line) 50%); }
    .folder.history { border-color: color-mix(in srgb, var(--coral), var(--line) 58%); }
    .folder.current { border-color: color-mix(in srgb, var(--amber), var(--line) 52%); }
    .folder b {
      display: block;
      font-size: 16px;
      line-height: 1.2;
    }
    .folder span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
    }
    .list-summary {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
      margin-bottom: 10px;
    }
    .summary-row + .summary-row {
      margin-top: 10px;
    }
    .summary-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .summary-bar {
      display: flex;
      height: 12px;
      overflow: hidden;
      border: 1px solid #050607;
      border-radius: 999px;
      background: #2a2f35;
    }
    .summary-segment {
      min-width: 0;
      height: 100%;
    }
    .summary-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 8px;
      margin-top: 6px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }
    .legend-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }
    .seg-puc { background: #fff15a; }
    .seg-uc { background: #ff7777; }
    .seg-maxxive { background: #cf77ff; }
    .seg-exc { background: #ff9a3d; }
    .seg-clear { background: #77dd77; }
    .seg-failed { background: #e94242; }
    .seg-noplay { background: #747b84; }
    .seg-s { background: #fff15a; }
    .seg-aaa_plus { background: #77ffff; }
    .seg-aaa { background: #7f8cff; }
    .seg-under_aaa { background: #747b84; }
    .song-list {
      display: grid;
      gap: 8px;
    }
    .song-cell {
      min-height: 78px;
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr) 112px;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-align: left;
      padding: 8px;
      width: 100%;
    }
    .jacket {
      width: 62px;
      height: 62px;
      border-radius: 6px;
      object-fit: cover;
      background: #050607;
      border: 1px solid #000;
    }
    .song-main {
      min-width: 0;
    }
    .title {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 4px;
      align-items: baseline;
      font-size: 15px;
      font-weight: 750;
      line-height: 1.25;
      min-width: 0;
      white-space: nowrap;
    }
    .title-lv {
      flex: none;
    }
    .title-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-diff {
      flex: none;
      color: var(--blue);
    }
    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .score-block {
      text-align: right;
      min-width: 0;
      display: grid;
      gap: 3px;
      justify-items: end;
    }
    .lamp-icon {
      height: 14px;
      max-width: 78px;
      object-fit: contain;
    }
    .score {
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 800;
    }
    .exscore {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .vf {
      color: var(--teal);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .empty, .error {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      padding: 22px 14px;
      text-align: center;
    }
    .detail-section .empty {
      border: 0;
      background: transparent;
      padding: 18px 8px;
    }
    .detail-head {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .detail-head .jacket {
      width: 96px;
      height: 96px;
    }
    .detail-title {
      min-width: 0;
      font-size: 20px;
      font-weight: 850;
      line-height: 1.2;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel2);
      color: var(--text);
      padding: 4px 8px;
      font-size: 12px;
    }
    .lamp-pill {
      min-width: 46px;
      justify-content: center;
    }
    .lamp-pill .lamp-icon {
      height: 14px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .metric strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      border-bottom: 1px solid var(--line);
      padding: 0 12px;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .section-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .detail-section {
      position: relative;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .detail-section::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--teal);
    }
    .detail-section.rivals::before {
      background: var(--amber);
    }
    .detail-section.logs::before {
      background: var(--blue);
    }
    .detail-section-body {
      padding: 0 10px 2px 14px;
    }
    .row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 10px 2px;
    }
    .row .lamp-icon {
      justify-self: center;
      max-width: 38px;
    }
    .row:last-child {
      border-bottom: 0;
    }
    .row b {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .row-score {
      text-align: right;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .load-more {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
    }
    @media (min-width: 720px) {
      main { max-width: 900px; width: 100%; margin: 0 auto; }
      .folders { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .song-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top">
        <button id="backBtn" class="icon-btn" aria-label="戻る" disabled>&lsaquo;</button>
        <h1 id="viewTitle">SDVX Helper</h1>
        <button id="refreshBtn" class="icon-btn" aria-label="更新">&#8635;</button>
      </div>
    </header>
    <section id="stats" class="stats"></section>
    <main id="content"></main>
  </div>

  <script>
    const state = {
      view: "home",
      stack: [],
      items: [],
      allItems: [],
      historyOffset: 0,
      historyTotal: 0,
      currentTimer: null,
    };
    const HISTORY_BASE = "sdvx-mobile-base";
    const HISTORY_APP = "sdvx-mobile-view";

    const $ = (id) => document.getElementById(id);
    const fmtScore = (v) => v == null ? "-" : Number(v).toLocaleString("ja-JP");
    const fmtTotalVf = (v) => ((Number(v) || 0) / 1000).toFixed(3);
    const fmtChartVf = (v) => ((Number(v) || 0) / 10).toFixed(1);

    async function api(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return await res.json();
    }

    function setTitle(text) {
      $("viewTitle").textContent = text;
      $("backBtn").disabled = state.stack.length === 0;
    }

    function setStats(items) {
      $("stats").innerHTML = items.map(([label, value]) => `
        <div class="stat"><span>${label}</span><strong>${value}</strong></div>
      `).join("");
    }

    function push(view) {
      state.stack.push(view);
    }

    function currentHistoryState() {
      return {
        kind: HISTORY_APP,
        view: state.view,
        stack: [...state.stack],
      };
    }

    function pushHistoryState() {
      window.history.pushState(currentHistoryState(), "", window.location.href);
    }

    function replaceHistoryState() {
      window.history.replaceState(currentHistoryState(), "", window.location.href);
    }

    function initBrowserBackControl() {
      window.history.replaceState({ kind: HISTORY_BASE }, "", window.location.href);
      window.history.pushState(currentHistoryState(), "", window.location.href);
    }

    async function restoreHistoryView(historyState) {
      if (!historyState || historyState.kind !== HISTORY_APP) {
        return;
      }
      state.stack = Array.isArray(historyState.stack) ? [...historyState.stack] : [];
      await openView(historyState.view, false);
    }

    function clearCurrentTimer() {
      if (state.currentTimer) {
        clearInterval(state.currentTimer);
        state.currentTimer = null;
      }
    }

    function escapeText(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function renderHome(data) {
      clearCurrentTimer();
      state.view = "home";
      setTitle("SDVX Helper");
      setStats([
        ["BEST", data.total_best_charts],
        ["PLAYS", data.total_results],
        ["VF", fmtTotalVf(data.total_vf)],
      ]);
      const special = data.special.map((f) => {
        const cls = f.id === "current" ? "current" : (f.id === "history" ? "history" : "primary");
        return `<button class="folder ${cls}" data-folder="${f.id}">
          <b>${escapeText(f.label)}</b><span>${f.count} charts</span>
        </button>`;
      }).join("");
      const levels = data.levels.map((f) => `<button class="folder" data-folder="${f.id}">
        <b>${escapeText(f.label)}</b><span>${f.count} charts</span>
      </button>`).join("");
      $("content").innerHTML = `<div class="grid folders">${special}${levels}</div>`;
      document.querySelectorAll("[data-folder]").forEach((button) => {
        button.addEventListener("click", () => openFolder(button.dataset.folder, true));
      });
    }

    function renderList(label, items, options = {}) {
      state.allItems = items;
      state.items = items;
      setTitle(label);
      setStats([
        ["CHARTS", items.length],
        ["BEST", items.filter((i) => i.score || i.best_score).length],
        ["VF", options.totalVf ? fmtTotalVf(options.totalVf) : "-"],
      ]);
      $("content").innerHTML = `
        <div class="toolbar">
          <input id="search" class="search" placeholder="Search" autocomplete="off">
        </div>
        <div id="listSummary"></div>
        <div id="songList" class="song-list"></div>
        ${options.loadMore ? '<button id="loadMore" class="load-more">MORE</button>' : ''}
      `;
      drawSummary(options.summary || buildSummary(items));
      $("search").addEventListener("input", applyFilter);
      if (options.loadMore) {
        $("loadMore").addEventListener("click", loadMoreHistory);
      }
      drawSongList(items);
    }

    function buildSummary(items) {
      const lampDefs = [
        ["puc", "PUC", 6],
        ["uc", "UC", 5],
        ["maxxive", "MAXXIVE", 4],
        ["exc", "EXC", 3],
        ["clear", "CLEAR", 2],
        ["failed", "FAILED", 1],
        ["noplay", "NO PLAY", 0],
      ];
      const scoreDefs = [
        ["s", "S", (score) => score >= 9900000],
        ["aaa_plus", "AAA+", (score) => score >= 9800000 && score < 9900000],
        ["aaa", "AAA", (score) => score >= 9700000 && score < 9800000],
        ["under_aaa", "UNDER AAA", (score) => score < 9700000],
      ];
      const total = items.length;
      const lamps = lampDefs.map(([key, label, value]) => {
        const count = items.filter((item) => Number(item.lamp || 0) === value).length;
        return { key, label, count, rate: total ? count / total * 100 : 0 };
      });
      const scores = scoreDefs.map(([key, label, predicate]) => {
        const count = items.filter((item) => predicate(Number(item.score || item.best_score || 0))).length;
        return { key, label, count, rate: total ? count / total * 100 : 0 };
      });
      return { total, lamps, scores };
    }

    function drawSummary(summary) {
      const node = $("listSummary");
      if (!node || !summary || !summary.total) {
        if (node) node.innerHTML = "";
        return;
      }
      node.innerHTML = `<section class="list-summary">
        ${summaryBar("Lamp", summary.lamps, summary.total)}
        ${summaryBar("Score", summary.scores, summary.total)}
      </section>`;
    }

    function summaryBar(label, items, total) {
      const visible = (items || []).filter((item) => item.count > 0);
      const segments = visible.map((item) => `
        <div class="summary-segment seg-${escapeText(item.key)}" style="width:${Math.max(0, item.rate).toFixed(3)}%"></div>
      `).join("");
      const legends = visible.map((item) => `
        <span class="legend-item"><span class="legend-swatch seg-${escapeText(item.key)}"></span>${escapeText(item.label)} ${item.count}</span>
      `).join("");
      return `<div class="summary-row">
        <div class="summary-head"><span>${escapeText(label)}</span><span>${total} items</span></div>
        <div class="summary-bar">${segments}</div>
        <div class="summary-legend">${legends}</div>
      </div>`;
    }

    function applyFilter() {
      const q = $("search").value.trim().toLowerCase();
      const items = q
        ? state.allItems.filter((item) => String(item.title || "").toLowerCase().includes(q))
        : state.allItems;
      drawSummary(buildSummary(items));
      drawSongList(items);
    }

    function drawSongList(items) {
      const node = $("songList");
      if (!items.length) {
        node.innerHTML = `<div class="empty">NO DATA</div>`;
        return;
      }
      node.innerHTML = items.map(songCell).join("");
      node.querySelectorAll("[data-chart]").forEach((button) => {
        button.addEventListener("click", () => openChart(button.dataset.chart, true));
      });
    }

    function songCell(item) {
      const score = item.score ?? item.best_score;
      const ex = item.exscore ?? item.best_ex;
      const diff = item.display_difficulty || item.difficulty || "";
      const meta = dateOnly(item.last_played || item.date || "");
      const lamp = lampIcon(item.lamp);
      return `<button class="song-cell" data-chart="${escapeText(item.chart_id || "")}">
        <img class="jacket" src="${escapeText(item.jacket_img)}" alt="">
        <div class="song-main">
          <div class="title">
            <span class="title-lv">Lv${escapeText(item.lv || "")}</span>
            <span class="title-name">${escapeText(item.title)}</span>
            <span class="title-diff">[${escapeText(diff)}]</span>
          </div>
          <div class="meta">${escapeText(meta)}</div>
        </div>
        <div class="score-block">
          <img class="lamp-icon" src="${lamp.src}" alt="${escapeText(item.lamp_text || "")}">
          <div class="score">${fmtScore(score)}</div>
          <div class="exscore">EX ${fmtScore(ex)}${exRate(ex, item.max_exscore)}</div>
          <div class="vf">VF ${fmtChartVf(item.vf)}</div>
        </div>
      </button>`;
    }

    function dateOnly(value) {
      return String(value || "").split(" ")[0];
    }

    function exRate(exscore, maxExscore) {
      const ex = Number(exscore);
      const max = Number(maxExscore);
      if (!ex || !max) return "";
      return ` (${(ex / max * 100).toFixed(1)}%)`;
    }

    function lampIcon(lamp) {
      const numericFiles = [
        "log_lamp_failed.png",
        "log_lamp_failed.png",
        "log_lamp_clear.png",
        "log_lamp_hard.png",
        "log_lamp_exh.png",
        "log_lamp_uc.png",
        "log_lamp_puc.png",
      ];
      const textFiles = {
        noplay: "log_lamp_failed.png",
        no_play: "log_lamp_failed.png",
        played: "log_lamp_failed.png",
        failed: "log_lamp_failed.png",
        comp: "log_lamp_clear.png",
        clear: "log_lamp_clear.png",
        exc: "log_lamp_hard.png",
        exc_comp: "log_lamp_hard.png",
        hard: "log_lamp_hard.png",
        maxxive: "log_lamp_exh.png",
        max_comp: "log_lamp_exh.png",
        mxm_comp: "log_lamp_exh.png",
        mxx_comp: "log_lamp_exh.png",
        exh: "log_lamp_exh.png",
        uc: "log_lamp_uc.png",
        puc: "log_lamp_puc.png",
      };
      const numeric = Number(lamp);
      const filename = Number.isFinite(numeric)
        ? numericFiles[numeric] || numericFiles[0]
        : textFiles[String(lamp || "").trim().toLowerCase().replace(/[-\s]+/g, "_")]
          || numericFiles[0];
      return { src: `/resources/${filename}` };
    }

    async function openFolder(id, shouldPush) {
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        if (id === "history") {
          state.historyOffset = 0;
          const data = await api("/api/history?limit=200&offset=0");
          state.view = "history";
          state.historyOffset = data.items.length;
          state.historyTotal = data.total;
          renderList(data.folder.label, data.items, {
            loadMore: data.items.length < data.total,
            summary: data.summary,
          });
          if (shouldPush) pushHistoryState();
          return;
        }
        const path = id === "vf" || id === "current" ? `/api/folders/${id}` : `/api/folders/${id}`;
        const data = await api(path);
        state.view = id;
        renderList(data.folder.label, data.items, {
          totalVf: data.total_vf,
          summary: data.summary,
        });
        if (shouldPush) pushHistoryState();
        if (id === "current") {
          state.currentTimer = setInterval(() => refreshCurrent(false), 2000);
        }
      } catch (e) {
        renderError(e);
      }
    }

    async function refreshCurrent(redrawTitle = true) {
      try {
        const data = await api("/api/folders/current");
        if (redrawTitle) setTitle(data.folder.label);
        state.allItems = data.items;
        drawSummary(data.summary || buildSummary(data.items));
        drawSongList(data.items);
        setStats([["CHARTS", data.items.length], ["BEST", data.items.length], ["VF", "-"]]);
      } catch (e) {
        renderError(e);
      }
    }

    async function loadMoreHistory() {
      const data = await api(`/api/history?limit=200&offset=${state.historyOffset}`);
      state.historyOffset += data.items.length;
      state.allItems = state.allItems.concat(data.items);
      drawSummary(buildSummary(state.allItems));
      applyFilter();
      if (state.historyOffset >= state.historyTotal) {
        $("loadMore")?.remove();
      }
    }

    async function openChart(chartId, shouldPush) {
      if (!chartId) return;
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        const data = await api(`/api/charts/${encodeURIComponent(chartId)}`);
        state.view = `chart:${chartId}`;
        renderDetail(data);
        if (shouldPush) pushHistoryState();
      } catch (e) {
        renderError(e);
      }
    }

    function renderDetail(data) {
      setTitle(data.title || "DETAIL");
      const best = data.best || data;
      const bestLamp = lampIcon(best.lamp ?? best.best_lamp);
      setStats([
        ["SCORE", fmtScore(best.score ?? best.best_score)],
        ["EX", fmtScore(best.exscore ?? best.best_ex)],
        ["VF", fmtChartVf(best.vf)],
      ]);
      const rivals = data.rival_items || [];
      const logs = data.items || [];
      $("content").innerHTML = `
        <section class="detail-head">
          <img class="jacket" src="${escapeText(data.jacket_img || best.jacket_img)}" alt="">
          <div>
            <div class="detail-title">${escapeText(data.title)}</div>
            <div class="pill-row">
              <span class="pill">LV${escapeText(data.lv || best.lv || "")}</span>
              <span class="pill">${escapeText(data.display_difficulty || data.difficulty || "")}</span>
              <span class="pill">${escapeText(best.grade || "")}</span>
              <span class="pill lamp-pill"><img class="lamp-icon" src="${bestLamp.src}" alt="${escapeText(best.lamp_text || "")}"></span>
            </div>
          </div>
        </section>
        <section class="metrics">
          <div class="metric"><span>BEST SCORE</span><strong>${fmtScore(best.score ?? best.best_score)}</strong></div>
          <div class="metric"><span>BEST EX</span><strong>${fmtScore(best.exscore ?? best.best_ex)}</strong></div>
          <div class="metric"><span>VOLFORCE</span><strong>${fmtChartVf(best.vf)}</strong></div>
          <div class="metric"><span>PLAYS</span><strong>${logs.length || data.play_count || 0}</strong></div>
        </section>
        <section class="detail-section rivals">
          <div class="section-title">Rivals <span>${rivals.length} players</span></div>
          <div class="detail-section-body">
            ${rivals.length ? rivals.map(rivalRow).join("") : '<div class="empty">NO DATA</div>'}
          </div>
        </section>
        <section class="detail-section logs">
          <div class="section-title">Play Log <span>${logs.length} plays</span></div>
          <div class="detail-section-body">
            ${logs.length ? logs.map(logRow).join("") : '<div class="empty">NO DATA</div>'}
          </div>
        </section>
      `;
    }

    function rivalRow(item) {
      const diff = item.diff > 0 ? `+${fmtScore(item.diff)}` : fmtScore(item.diff);
      const lamp = lampIcon(item.lamp);
      return `<div class="row">
        <img class="lamp-icon" src="${lamp.src}" alt="${escapeText(item.lamp_text || "")}">
        <div><b>${item.rank}. ${escapeText(item.player)}</b></div>
        <div class="row-score">${fmtScore(item.score)}<span>EX ${fmtScore(item.exscore)} / ${diff}</span></div>
      </div>`;
    }

    function logRow(item) {
      const lamp = lampIcon(item.lamp);
      return `<div class="row">
        <img class="lamp-icon" src="${lamp.src}" alt="${escapeText(item.lamp_text || "")}">
        <div><b>${escapeText(item.date)}</b><span>${escapeText(item.grade)}</span></div>
        <div class="row-score">${fmtScore(item.score)}<span>EX ${fmtScore(item.exscore)} / VF ${fmtChartVf(item.vf)}</span></div>
      </div>`;
    }

    function renderError(e) {
      $("content").innerHTML = `<div class="error">${escapeText(e.message || e)}</div>`;
    }

    async function loadHome() {
      clearCurrentTimer();
      state.view = "home";
      state.stack = [];
      try {
        renderHome(await api("/api/folders"));
        replaceHistoryState();
      } catch (e) {
        renderError(e);
      }
    }

    async function openView(view, shouldPush) {
      if (!view || view === "home") {
        await loadHome();
      } else if (view.startsWith("chart:")) {
        await openChart(view.slice(6), shouldPush);
      } else {
        await openFolder(view, shouldPush);
      }
    }

    async function goUpOneLevel(rewriteHistory = true) {
      const previous = state.stack.pop();
      if (!previous) {
        if (confirm("終了しますか？")) {
          window.history.back();
        }
        return;
      }
      await openView(previous, false);
      if (rewriteHistory) {
        replaceHistoryState();
      }
    }

    $("backBtn").addEventListener("click", () => {
      goUpOneLevel(true);
    });
    $("refreshBtn").addEventListener("click", () => {
      if (state.view === "home") loadHome();
      else if (state.view.startsWith("chart:")) openChart(state.view.slice(6), false);
      else openFolder(state.view, false);
    });
    window.addEventListener("popstate", (event) => {
      if (event.state && event.state.kind === HISTORY_APP) {
        restoreHistoryView(event.state);
        return;
      }
      if (state.stack.length > 0) {
        goUpOneLevel(false).then(() => pushHistoryState());
        return;
      }
      if (!event.state || event.state.kind === HISTORY_BASE) {
        if (confirm("終了しますか？")) {
          window.history.back();
        } else {
          window.history.pushState(currentHistoryState(), "", window.location.href);
        }
        return;
      }
    });

    initBrowserBackControl();
    loadHome();
  </script>
</body>
</html>
