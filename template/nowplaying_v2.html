<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>SDVX Now Playing v2</title>
    <link rel="stylesheet" href="./websocket.css">
    <style>
        :root {
            --websocket-port: 8767;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 500px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            color: #fff;
            font-family: "Meiryo", sans-serif;
            text-shadow:
                4px 4px 0 #000,
                -2px 2px 0 #000,
                2px -2px 0 #000,
                -2px -2px 0 #000;
        }

        .nowplaying {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            grid-template-rows:
                1fr auto 18px auto 10px auto 1fr;
            column-gap: 24px;
            padding: 34px;
            position: relative;
            background:
                linear-gradient(90deg, rgba(18, 32, 94, 0.92), rgba(7, 8, 22, 0.92) 48%, rgba(34, 10, 64, 0.92)),
                rgba(0, 0, 0, 0.82);
            border: 12px solid #02144a;
        }

        .jacket-wrap {
            grid-column: 1;
            grid-row: 1 / -1;
            width: 210px;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            justify-self: center;
            align-self: center;
            background: rgba(0, 0, 0, 0.35);
            border: 4px solid rgba(105, 190, 255, 0.65);
            box-shadow: 0 0 24px rgba(0, 190, 255, 0.25);
        }

        #jacket {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .song-info,
        .chart-info {
            display: contents;
        }

        .song-title-block,
        .song-artist-block,
        .chart-info {
            grid-column: 2;
            min-width: 0;
            overflow: hidden;
        }

        .song-title-block {
            grid-row: 2;
            align-self: start;
        }

        .song-artist-block {
            grid-row: 4;
            align-self: end;
        }

        .chart-info {
            grid-column: 2;
            grid-row: 6;
            align-self: start;
            display: flex;
            align-items: baseline;
            gap: 0.35em;
            min-width: 0;
            color: #9ee8ff;
            font-size: 30px;
            line-height: 1;
            font-weight: 700;
            text-shadow: 2px 2px 0 #000;
        }

        .label {
            font-size: 30px;
            line-height: 1;
            color: #9ee8ff;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000;
        }

        .title,
        .artist {
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .title {
            font-size: 56px;
            line-height: 1.08;
            font-weight: 800;
        }

        .artist {
            color: #d8f7ff;
            font-size: 44px;
            line-height: 1.14;
            font-weight: 700;
        }

        .level,
        .difficulty {
            display: inline;
            color: inherit;
            font: inherit;
            line-height: inherit;
            text-align: left;
            padding: 0;
        }

        .difficulty.nov {
            color: #74c7ff;
        }

        .difficulty.adv {
            color: #ffe36e;
        }

        .difficulty.exh {
            color: #ff7777;
        }

        .empty {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="nowplaying">
        <div class="jacket-wrap">
            <img src="" id="jacket" class="empty" alt="">
        </div>
        <div class="song-info">
            <div class="song-title-block">
                <div class="label">title</div>
                <div class="title" id="title">---</div>
            </div>
            <div class="song-artist-block">
                <div class="label">artist</div>
                <div class="artist" id="artist">---</div>
            </div>
        </div>
        <div class="chart-info" aria-label="chart information">
            <span class="level" id="level">Lv--</span><span>,</span>
            <span class="difficulty" id="difficulty">---</span>
        </div>
    </div>

    <script src="./sdvx_ws_client.js"></script>
    <script>
        function setImage(id, src) {
            const el = document.getElementById(id);
            if (!el) return;
            if (src) {
                if (el.dataset.currentSrc === src) return;
                el.dataset.requestSrc = src;
                const loader = new Image();
                loader.onload = function () {
                    if (el.dataset.requestSrc !== src) return;
                    el.src = src;
                    el.dataset.currentSrc = src;
                    el.classList.remove("empty");
                };
                loader.onerror = function () {
                    if (!el.dataset.currentSrc) el.classList.add("empty");
                };
                loader.src = src;
            } else {
                el.removeAttribute("src");
                delete el.dataset.currentSrc;
                delete el.dataset.requestSrc;
                el.classList.add("empty");
            }
        }

        function decodeText(value) {
            if (value === null || value === undefined || value === "") return "";
            const decoder = decodeText.decoder || document.createElement("textarea");
            decodeText.decoder = decoder;
            decoder.innerHTML = String(value);
            return decoder.value;
        }

        function setText(id, value, fallback) {
            document.getElementById(id).textContent = decodeText(value) || fallback;
        }

        function setDifficulty(value) {
            const el = document.getElementById("difficulty");
            const text = decodeText(value) || "---";
            const key = text.toUpperCase();

            el.textContent = text;
            el.classList.remove("nov", "adv", "exh");

            if (key === "NOV") el.classList.add("nov");
            else if (key === "ADV") el.classList.add("adv");
            else if (key === "EXH") el.classList.add("exh");
        }

        function update(data) {
            if (!data) return;
            const images = data.images || {};
            setImage("jacket", images.jacket);
            setText("title", data.title, "---");
            setText("artist", data.artist, "---");
            setText("level", data.level ? "Lv" + data.level : "", "Lv--");
            setDifficulty(data.difficulty);
        }

        SDVXWebSocketClient.connect({
            type: "nowplaying",
            target: "nowplaying",
            onData: update
        });
    </script>
</body>

</html>
