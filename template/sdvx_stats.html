<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>SDVX Helper Stats v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../out/websocket.css">
    <style>
        body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: "RocknRoll One", sans-serif;
            font-size: 31px;
            color: #fff;
            text-shadow: 3px 3px 0 #000,
                -1px 1px 0 #000,
                1px -1px 0 #000,
                -1px -1px 0 #000;
        }

        iframe {
            overflow: hidden;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            border: none;
            padding: 7px;
            margin: 0;
        }

        .all {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-image: url("sdvx_stats_bg.png"), url("sdvx_stats_background.png");
            background-color: rgba(0, 0, 0, 0.98);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            border: solid 1px white;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }

        .info {
            font-family: "Dela Gothic One", sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .titlearea {
            font-family: "Black Ops One", cursive;
            border: solid 1px white;
            background: linear-gradient(150deg, rgba(0, 0, 60, 0.9), rgba(35, 85, 205, 0.9));
            color: #f8b178;
            padding: 0;
            margin: 0;
            text-align: center;
            text-shadow: 3px 3px 0 #222299,
                -1px 1px 0 #222299,
                1px -1px 0 #222299,
                -1px -1px 0 #222299;
        }

        table#title {
            width: 100%;
            margin: 0;
        }

        table#title td {
            width: 33%;
            margin: 0;
            text-align: center;
        }

        table#title td:nth-child(2) {
            font-size: 19px;
        }

        table#title td:nth-child(3) {
            color: #aaffaa;
            font-size: 14px;
            text-align: right;
            padding-right: 29px;
        }

        table#info {
            font-family: "RocknRoll One", sans-serif;
            font-size: 34px;
            width: 80%;
            margin: 0 auto;
            padding: 0;
            text-align: right;
            overflow: hidden;
        }

        table#info td {
            width: 25%;
            text-align: center;
        }

        table#info tr:nth-child(1) {
            font-size: 12px;
        }

        table#info tr:nth-child(2) {
            font-size: 38px;
            vertical-align: baseline;
        }

        table#info tr:nth-child(2) td:nth-child(1) {
            font-family: "Black Ops One", cursive;
        }

        table#info tr:nth-child(2) td:nth-child(2) {
            font-family: "Mochiy Pop P One", sans-serif;
        }

        img {
            height: 48px;
            vertical-align: bottom;
        }

        table tr:nth-child(2) td:nth-child(4) {
            font-family: "Black Ops One", cursive;
        }

        .base-frame {
            background-color: rgba(0, 0, 0, 0);
            display: flex;
            flex-direction: row;
            overflow: hidden;
            margin: 0;
            margin-bottom: 29px;
            padding: 0;
        }

        .left-frame {
            border: 2px solid white;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 23px 0 0 19px;
            padding: 12px 10px 0 0;
            width: 75%;
            height: 76.5%;
            position: relative;
        }

        .right-frame {
            font-family: "RocknRoll One", sans-serif;
            border: 2px solid white;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 23px 19px 0 19px;
            padding: 10px 19px;
            width: 25%;
            height: 77%;
            font-size: 15px;
            position: relative;
        }

        .extra {
            width: 29%;
            height: 16.5%;
            position: absolute;
            top: 81.5%;
            left: 72.2%;
            text-align: center;
        }

        img#slideshow {
            height: 100%;
            vertical-align: bottom;
        }

        img#icon {
            max-height: 100%;
            vertical-align: bottom;
        }

        .titlelabel {
            text-align: center;
            position: absolute;
            display: inline-block;
            top: -22px;
            left: 0;
            padding: 0;
            height: 19px;
            width: 96px;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            background-color: #ddddff;
            border: 1px solid #ddddff;
            border-radius: 5px 5px 0 0;
            font-family: "LINE Seed JP App_TTF ExtraBold", sans-serif;
            bottom: 100%;
            text-shadow:
                1px 1px 1px #fff, -1px -1px 1px #fff,
                -1px 1px 1px #fff, 1px -1px 1px #fff;
        }

        .lv14,
        .lv15,
        .lv16,
        .lv17,
        .lv18,
        .lv19,
        .lv20 {
            background-color: rgba(10, 10, 40, 0.1);
            margin-top: 34px;
            margin-bottom: 34px;
        }

        .lv14 {
            margin-top: 14px;
        }

        .lv20 {
            margin-bottom: 14px;
        }

        .lamp,
        .scorebar {
            height: 10px;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            margin-right: 2%;
            border: 2px solid #000;
        }

        lv14 {
            color: #ffa6a6;
        }

        lv15 {
            color: #ffc977;
        }

        lv16 {
            color: #77ff77;
        }

        lv17 {
            color: #aabbff;
        }

        lv18 {
            color: #f8f871;
        }

        lv19 {
            color: #ffaacc;
        }

        lv20 {
            color: #ab77ff;
        }

        .puc {
            background-color: #ffff00;
            border: 2px fff;
            width: 0;
        }

        .uc {
            background-color: #ff7777;
            border: 2px fff;
            width: 0;
        }

        .exh {
            background-color: #dddddd;
            border: 2px fff;
            width: 0;
        }

        .hard {
            background-color: #c477ff;
            border: 2px fff;
            width: 0;
        }

        .clear {
            background-color: #77ff77;
            border: 2px fff;
            width: 0;
        }

        @keyframes flashfailed {
            0% {
                background-color: #ff2828;
            }

            50% {
                background-color: #282828;
            }

            100% {
                background-color: #ff2828;
            }
        }

        .failed {
            animation-name: flashfailed;
            animation-duration: 0.08s;
            animation-iteration-count: infinite;
            border: 2px fff;
            width: 0;
        }

        .noplay {
            background-color: #777;
            border: 2px fff;
            width: 100%;
        }

        .rank_s {
            background-color: #ffff00;
            border: 2px fff;
            width: 0;
        }

        .rank_aaa_plus {
            background-color: #77ffff;
            border: 2px fff;
            width: 0;
        }

        .rank_aaa {
            background-color: #7777ff;
            border: 2px fff;
            width: 0;
        }

        .rank_under_aaa {
            background-color: #777;
            border: 2px fff;
            width: 100%;
        }

        vfdiff {
            color: #ccccff;
        }
    </style>
</head>

<body>
    <div class="all disconnected" id="main-container">
        <div class="info">
            <div class="titlearea">
                <table id="title">
                    <tr>
                        <td></td>
                        <td>SOUND VOLTEX (PC ver.) VOLFORCE Target Charts</td>
                        <td>powered by sdvx_helper</td>
                    </tr>
                </table>
            </div>
            <table id="info">
                <tr>
                    <td>date</td>
                    <td>player name</td>
                    <td>class</td>
                    <td>volforce</td>
                </tr>
                <tr>
                    <td><playdate></playdate></td>
                    <td><player_name></player_name></td>
                    <td><img src="class_cur.png" height="120px" alt=""></td>
                    <td><total_vf></total_vf></td>
                </tr>
            </table>
        </div>
        <div class="base-frame">
            <div class="left-frame">
                <span class="titlelabel">VF bests</span>
                <iframe src="total_vf_v2.html" width="100%" height="1104" id="vf-frame"></iframe>
            </div>
            <div class="right-frame">
                <span class="titlelabel">Stats</span>
                <div id="stats-list"></div>
            </div>
            <div class="extra">
                <img src="sdvx_stats_banner.png" id="slideshow" alt="">
            </div>
        </div>
    </div>

    <script src="./sdvx_ws_client.js"></script>
    <script>
        const mainContainer = document.getElementById("main-container");
        const statsList = document.getElementById("stats-list");

        function setConnectionState(state) {
            mainContainer.classList.toggle("connected", state === "connected");
            mainContainer.classList.toggle("disconnected", state !== "connected");
        }

        function number(value, fallback) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : (fallback || 0);
        }

        function setText(scope, selector, value) {
            const el = scope.querySelector(selector);
            if (el) el.textContent = value;
        }

        function setWidth(scope, selector, value, total) {
            const el = scope.querySelector(selector);
            if (!el) return;
            el.style.width = total > 0 ? (100 * value / total) + "%" : "0%";
        }

        function dateOnly(value) {
            return String(value || "").split(/[ T]/)[0];
        }

        function levelRow(lv) {
            return `
                <div class="lv${lv}">
                    Lv<lv></lv> &nbsp;&nbsp;&nbsp;&nbsp;ave:&nbsp;<average></average><br>
                    <font color="#ffffcc">PUC:</font><puc></puc>,&nbsp;
                    <font color="#ff7777">UC:</font><uc></uc>,&nbsp;
                    <font color="#dddddd">M:</font><exh></exh>,&nbsp;
                    <font color="#cf77ff">E:</font><hard></hard>,&nbsp;
                    <font color="#77ff77">C:</font><clear></clear>,&nbsp;
                    <div class="lamp lv${lv}lamp">
                        <div class="puc"></div>
                        <div class="uc"></div>
                        <div class="exh"></div>
                        <div class="hard"></div>
                        <div class="clear"></div>
                        <div class="failed"></div>
                        <div class="noplay"></div>
                    </div>
                    <font color="#ffff00">S:</font><rank_s></rank_s>,&nbsp;
                    <font color="#77ffff">AAA+:</font><rank_aaa_plus></rank_aaa_plus>,&nbsp;
                    <font color="#7777ff">AAA:</font><rank_aaa></rank_aaa>,&nbsp;
                    <div class="scorebar lv${lv}score">
                        <div class="rank_s"></div>
                        <div class="rank_aaa_plus"></div>
                        <div class="rank_aaa"></div>
                        <div class="rank_under_aaa"></div>
                    </div>
                </div>
            `;
        }

        function renderStaticRows() {
            let html = "";
            for (let lv = 14; lv <= 20; lv++) html += levelRow(lv);
            statsList.innerHTML = html;
        }

        function updateStats(data) {
            if (!data) return;
            document.querySelector("playdate").textContent = dateOnly(data.date);
            document.querySelector("player_name").innerHTML = (data.player_name || "NONAME") + '<img src="player_icon.png" id="icon" alt="">';

            const vf = data.total_vf || "0.000";
            const vfDiff = Number(data.total_vf_diff || 0);
            document.querySelector("total_vf").innerHTML = vfDiff > 0 ? vf + " (<vfdiff>+" + vfDiff + "</vfdiff>)" : vf;

            const lvs = data.lvs || {};
            for (let lv = 14; lv <= 20; lv++) {
                const s = lvs[lv] || lvs[String(lv)] || {};
                const row = document.querySelector(".lv" + lv);
                if (!row) continue;

                const puc = number(s.puc);
                const uc = number(s.uc);
                const exh = number(s.exc ?? s.exh);
                const hard = number(s.maxxive ?? s.mxx ?? s.hard);
                const clear = number(s.clear ?? s.clr);
                const failed = number(s.failed ?? s.fld);
                const total = number(s.total, puc + uc + exh + hard + clear + failed + number(s.noplay));
                const played = number(s.played, puc + uc + exh + hard + clear + failed);
                const noplay = Math.max(number(s.noplay, total - played), 0);
                const totalLamp = puc + uc + exh + hard + clear + failed + noplay;

                const rankS = number(s.s);
                const rankAaaPlus = number(s.aaa_plus);
                const rankAaa = number(s.aaa);
                const totalScore = totalLamp || total || played;
                const rankUnderAaa = Math.max(totalScore - rankS - rankAaaPlus - rankAaa, 0);

                row.querySelector("lv").innerHTML = "<lv" + lv + ">" + lv + "</lv" + lv + ">";
                setText(row, "average", number(s.average).toLocaleString());
                setText(row, "puc", puc);
                setText(row, "uc", uc);
                setText(row, "exh", exh);
                setText(row, "hard", hard);
                setText(row, "clear", clear);
                setText(row, "rank_s", rankS);
                setText(row, "rank_aaa_plus", rankAaaPlus);
                setText(row, "rank_aaa", rankAaa);

                const lamp = row.querySelector(".lamp");
                setWidth(lamp, ".noplay", noplay, totalLamp);
                setWidth(lamp, ".failed", failed, totalLamp);
                setWidth(lamp, ".clear", clear, totalLamp);
                setWidth(lamp, ".hard", hard, totalLamp);
                setWidth(lamp, ".exh", exh, totalLamp);
                setWidth(lamp, ".uc", uc, totalLamp);
                setWidth(lamp, ".puc", puc, totalLamp);

                const score = row.querySelector(".scorebar");
                setWidth(score, ".rank_s", rankS, totalScore);
                setWidth(score, ".rank_aaa_plus", rankAaaPlus, totalScore);
                setWidth(score, ".rank_aaa", rankAaa, totalScore);
                setWidth(score, ".rank_under_aaa", rankUnderAaa, totalScore);
            }
        }

        renderStaticRows();

        SDVXWebSocketClient.connect({
            type: "stats",
            target: "stats",
            onState: setConnectionState,
            onData: updateStats
        });
    </script>
</body>

</html>
