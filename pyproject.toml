[project]
name = "sdvx-helper"
version = "2.0.0"
description = "sdvx_helper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "cx-freeze>=8.5.3",
    "google-cloud-storage>=3.9.0",
    "imagehash>=4.3.2",
    "keyboard>=0.13.5",
    "numpy>=2.4.1",
    "obsws-python>=1.8.0",
    "opencv-python>=4.13.0.90",
    "pillow>=12.1.0",
    # PySide6 6.10.1 win_amd64 currently leaves Qt6Core.dll depending on an
    # external icuuc.dll in this environment, which breaks QtCore/QtGui import.
    "pyside6>=6.9,<6.10",
    "websockets>=16.0",
]
